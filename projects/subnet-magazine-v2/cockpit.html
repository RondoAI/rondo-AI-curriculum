<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Cockpit · Subneτ Magazine</title>
  <meta name="description" content="The unified cockpit — a big live price chart for any Bittensor subnet, with magazine articles + research scrolling in a side panel beside the chart. No scrolling under the chart, no scattered pages: the whole workspace is one frame.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300..800&family=Inter:wght@300..800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style/tokens.css">
  <link rel="stylesheet" href="style/base.css">
  <link rel="stylesheet" href="style/components/slide-hint.css">
  <link rel="stylesheet" href="style/components/tickers.css">
  <link rel="stylesheet" href="style/components/status-strip.css">
  <link rel="stylesheet" href="style/components/masthead.css">
  <link rel="stylesheet" href="style/components/panel.css">
  <link rel="stylesheet" href="style/components/command-palette.css">
  <link rel="stylesheet" href="style/components/pdf-viewer.css">
  <link rel="stylesheet" href="style/components/compare-modal.css">
  <link rel="stylesheet" href="style/components/mobile-nav.css">
  <link rel="stylesheet" href="style/components/hist-modal.css">
  <link rel="stylesheet" href="style/components/cockpit.css">
  <!-- chart-mode.css carries the shared .cm-tooltip + .ct-tt__*
       selectors the cockpit chart's hover tooltip reuses (closes
       the Cockpit Chart Tooltip Parity ask). Unused chart-mode
       layout/header rules silently no-op here. -->
  <link rel="stylesheet" href="style/components/chart-mode.css">
  <!-- Dashboard stylesheets — per Rondo 2026-05-18 the whole
       dashboard content (KPI status bar, MY DESK, BRIEFINGS,
       DETAIL, MARKETS, ARC, EDITORIAL INTEL, ATTR) is mounted
       below the cockpit pane on this page, so the cockpit page
       needs every CSS the dashboard view paints against. Loaded
       AFTER cockpit.css so cockpit's specific rules win on the
       shared selectors (.panel etc.) inside the cockpit pane;
       dashboard rules apply to the dashboard mount below. -->
  <link rel="stylesheet" href="style/components/dashboard.css">
  <link rel="stylesheet" href="style/components/briefings.css">
  <link rel="stylesheet" href="style/components/news-cards.css">
  <link rel="stylesheet" href="style/components/commentary.css">
  <link rel="stylesheet" href="style/components/article-coverage.css">
  <link rel="stylesheet" href="style/components/attribution.css">
  <link rel="stylesheet" href="style/components/paper-portfolio.css">
  <link rel="stylesheet" href="style/components/dash-nav.css">
  <link rel="stylesheet" href="style/components/collapsible.css">
  <link rel="stylesheet" href="style/components/paywall.css">
</head>
<body>
  <div data-mount="tickers"></div>
  <div data-mount="statusbar"></div>
  <div data-mount="masthead"></div>
  <aside class="flow-thread" aria-hidden="true">
    <span class="flow-thread__pulse"></span>
  </aside>
  <main id="main">
    <div data-mount="cockpit"></div>
    <!-- Per Rondo 2026-05-18: the entire dashboard content goes
         here, beneath the cockpit pane, so the cockpit page is
         the single workspace ("this whole entire content should
         be in the cockpit"). Mounting the dashboard view second
         appends KPI strip + MY DESK + BRIEFINGS + DETAIL + MARKETS
         + ARC + EDITORIAL INTEL sections below the cockpit chart. -->
    <div data-mount="dashboard"></div>
  </main>
  <script src="config.js"></script>
  <script type="module" src="src/boot.js?v=20260520s"></script>
</body>
</html>
