<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: #050203; }
  #pfp { display: block; background: #050203; }
</style>
</head>
<body>
<canvas id="pfp" width="2048" height="2048"></canvas>
<script type="module">
  import { NodeSphere } from '/src/charts/NodeSphere.js';
  const canvas = document.getElementById('pfp');
  /* HIGH-DENSITY version of the magazine's canonical NodeSphere:
     - More nodes than the masthead (200 vs 72) so the plexus reads
       rich at PFP / Twitter avatar size
     - Higher K + density for tighter interior filigree
     - More edges allowed (8K cap, up from 3K) for the dense look
     - speed 0 = freeze on a specific angle (we drive frames manually
       so we can pick the most flattering rotation)
     - No atmospheric halo competing with the plexus silhouette */
  const sphere = new NodeSphere(canvas, {
    nodes:   220,
    K:       6,
    density: 0.18,
    edgeCap: 8000,
    speed:   0,
    glow:    true,
    atmos:   true,
  });
  /* Drive a specific frame — t=2.4 gives the sphere a 3/4 rotation
     where the densest cluster of nodes sits in the visible front,
     giving the PFP its most dense / "this is what intelligence
     looks like" silhouette. */
  const ctx = canvas.getContext('2d');
  sphere.draw(ctx, 2048, 2048, 2.4);
  window.__PFP_READY__ = true;
</script>
</body>
</html>
