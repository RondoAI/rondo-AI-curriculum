<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Subneτ Magazine — Twitter banner renderer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style/tokens.css">
<style>
  /* TWITTER BANNER (1500x500, 3:1).
     Twitter overlays the profile picture on the lower-left of the
     banner — avatar centroid roughly at (180, 460), 200px diameter.
     The lower-left ~280x180 wedge is therefore reserved as
     atmospheric / empty so the PFP NodeSphere sits cleanly on top.

     What goes on this banner (and what does NOT):
       YES — the wordmark
       YES — the NodeSphere brand mark
       YES — one short Biττensor tagline
       NO  — dates, edition strips, vol/no, menus
       NO  — ticker tapes, plexus bands, decorative chrome
       NO  — @handle attribution (Twitter already shows the handle)
     A Twitter banner is a brand statement, not a magazine cover. */

  html, body { margin: 0; padding: 0; }
  body{
    width: 1500px; height: 500px;
    background: var(--c-bg-1);
    color: var(--c-ink-1);
    font-family: var(--f-serif);
    position: relative;
    overflow: hidden;
  }

  /* Subtle red atmosphere anchored on the sphere — softens the
     transition from the dense plexus into the black, so the sphere
     doesn't feel pasted on top of the field. The faint vignette
     toward the lower-left gives the PFP a darker pocket to land
     on so its silhouette pops. */
  .banner__atmos{
    position: absolute; inset: 0;
    background:
      radial-gradient(circle at 82% 50%, rgba(255,30,60,.14) 0%, rgba(255,30,60,0) 38%),
      radial-gradient(circle at 14% 88%, rgba(0,0,0,.55) 0%, rgba(0,0,0,0) 32%);
    pointer-events: none;
  }

  /* HERO — wordmark + accent rule + tagline. Anchored to the left
     of the banner but offset right of the PFP overlap zone so the
     avatar doesn't cover any letterforms. Vertically centered.
     Wordmark sized to end ~30px short of the NodeSphere on the
     right so the two never collide. */
  .banner__hero{
    position: absolute; left: 290px; top: 50%;
    transform: translateY(-50%);
    max-width: 720px;
  }
  .banner__wordmark{
    font-family: var(--f-serif);   /* Archivo — the magazine display family */
    font-weight: 800;
    font-size: 94px;
    line-height: 1;
    letter-spacing: -.030em;
    color: var(--c-ink-1);
    margin: 0;
    white-space: nowrap;
  }
  .banner__accent{
    width: 78px; height: 2px;
    background: var(--c-red);
    margin: 26px 0 22px;
  }
  .banner__tagline{
    font-family: var(--f-serif);
    font-weight: 400;
    font-size: 26px; line-height: 1.2;
    color: var(--c-ink-2);
    letter-spacing: -.005em;
    margin: 0;
  }
  .banner__tagline em{
    font-style: normal;
    color: var(--c-ink-1);
    font-weight: 600;
  }

  /* NodeSphere brand mark on the right — the canonical visual
     identity that drives the PFP, masthead, and every other surface.
     Sized so it sits beside the wordmark without crowding. */
  .banner__sphere{
    position: absolute; right: 80px; top: 50%;
    transform: translateY(-50%);
    width: 380px; height: 380px;
    display: block;
  }

  /* Every τ across the banner uses the SAME glyph as the canonical
     "Subneτ Magazine" wordmark — plain Archivo (the magazine's
     display family), the exact treatment Rondo approved. Auto-wrapped
     by the JS at the bottom of this file so every τ in markup AND
     generated content carries the same brand mark. */
  .tau-brand{
    font-family: 'Archivo', 'Inter', system-ui, sans-serif;
    font-style: normal;
    font-weight: inherit;
    font-size: 1em;
    color: inherit;
    display: inline;
    line-height: 1;
  }
</style>
</head>
<body>
  <div class="banner__atmos"></div>

  <div class="banner__hero">
    <h1 class="banner__wordmark">Subneτ Magazine</h1>
    <div class="banner__accent"></div>
    <p class="banner__tagline"><em>Biττensor</em> research.</p>
  </div>

  <canvas id="sphere" class="banner__sphere" width="380" height="380"></canvas>

  <script type="module">
    import { NodeSphere } from '/src/charts/NodeSphere.js';

    /* Same canonical NodeSphere as the PFP + masthead, sized to fill
       the right side of the banner without crowding the wordmark.
       Frozen at t=2.4 — the same rotation that gives the PFP its
       dense forward silhouette, so the PFP and the banner sphere
       carry the identical visual mark. */
    const c = document.getElementById('sphere');
    const sphere = new NodeSphere(c, {
      nodes:   180,
      K:       6,
      density: 0.20,
      edgeCap: 7000,
      speed:   0,
      glow:    true,
      atmos:   true,
    });
    sphere.draw(c.getContext('2d'), 380, 380, 2.4);

    /* Promote every τ to the .tau-brand span so the Archivo glyph
       (already the parent font here) is explicit and any future
       per-character treatment is a one-line CSS change rather than
       a markup hunt. */
    (function wrapTaus(root){
      const SKIP = new Set(['SCRIPT','STYLE','CANVAS','SVG']);
      const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
        acceptNode(node){
          if (SKIP.has(node.parentNode?.tagName)) return NodeFilter.FILTER_REJECT;
          let p = node.parentNode;
          while (p){
            if (p.classList && p.classList.contains('tau-brand')) return NodeFilter.FILTER_REJECT;
            p = p.parentNode;
          }
          return node.nodeValue.includes('τ') ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
        }
      });
      const targets = [];
      let n;
      while ((n = walker.nextNode())) targets.push(n);
      targets.forEach(textNode => {
        const frag = document.createDocumentFragment();
        textNode.nodeValue.split(/(τ)/).forEach(part => {
          if (part === 'τ'){
            const s = document.createElement('span');
            s.className = 'tau-brand';
            s.textContent = 'τ';
            frag.appendChild(s);
          } else if (part){
            frag.appendChild(document.createTextNode(part));
          }
        });
        textNode.parentNode.replaceChild(frag, textNode);
      });
    })(document.body);

    window.__BANNER_READY__ = true;
  </script>
</body>
</html>
