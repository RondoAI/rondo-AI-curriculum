<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Subneτ Magazine — Twitter banner renderer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style/tokens.css">
<style>
  /* TWITTER BANNER (1500x500, 3:1).
     Twitter overlays the profile picture on the lower-left of the
     banner — avatar centroid roughly at (180, 460), 200px diameter.
     The lower-left ~280x180 wedge is therefore reserved as
     atmospheric / empty so the PFP NodeSphere sits cleanly on top.

     What goes on this banner (and what does NOT):
       YES — the wordmark
       YES — the NodeSphere brand mark
       YES — one short Biττensor tagline
       NO  — dates, edition strips, vol/no, menus
       NO  — ticker tapes, plexus bands, decorative chrome
       NO  — @handle attribution (Twitter already shows the handle)
     A Twitter banner is a brand statement, not a magazine cover. */

  html, body { margin: 0; padding: 0; }
  body{
    width: 1500px; height: 500px;
    background: var(--c-bg-1);
    color: var(--c-ink-1);
    font-family: var(--f-serif);
    position: relative;
    overflow: hidden;
  }

  /* Subtle red atmosphere — TIGHTLY scoped to the right edge so it
     doesn't bleed into the wordmark area. Previous gradient had a
     38% radius that reached x=660 (well inside the wordmark zone);
     this one fades at 22% so it dies cleanly in the gap between
     wordmark and sphere while giving the sphere SLIGHTLY more
     atmospheric depth around it (previous 18% / .10 felt too
     contained — sphere read flat). Soft black vignette in the
     lower-left gives the PFP its own pocket of darkness. */
  .banner__atmos{
    position: absolute; inset: 0;
    background:
      radial-gradient(circle at 90% 50%, rgba(255,30,60,.14) 0%, rgba(255,30,60,0) 22%),
      radial-gradient(circle at 14% 88%, rgba(0,0,0,.55) 0%, rgba(0,0,0,0) 32%);
    pointer-events: none;
  }

  /* HERO — wordmark + tagline. Anchored to the left of the banner
     but offset right of the PFP overlap zone so the avatar doesn't
     cover any letterforms. Positioned so the WORDMARK's vertical
     center lands exactly on the sphere's center line — the two
     read as anchored to the same horizontal axis. Tagline drops
     below as a secondary element. */
  .banner__hero{
    position: absolute; left: 290px; top: 0; bottom: 0;
    width: 720px;
  }
  .banner__wordmark{
    position: absolute; left: 0;
    top: 50%;
    transform: translateY(-50%);
    font-family: var(--f-serif);   /* Archivo — the magazine display family */
    font-weight: 800;
    font-size: 94px;
    line-height: 1;
    /* Tightened from -.030em → -.042em. At 94px display weight,
       -.030em felt loose for a masthead-confident wordmark; the
       extra tightening packs the letterforms so the wordmark
       reads as ONE word, not seven adjacent characters.
       Masthead reference: Bloomberg, NYT, FT all run their
       display wordmarks tighter than -.030em at this size. */
    letter-spacing: -.042em;
    color: var(--c-ink-1);
    margin: 0;
    white-space: nowrap;
  }
  .banner__tagline{
    position: absolute; left: 0;
    top: calc(50% + 56px);
    font-family: var(--f-serif);
    font-weight: 400;
    font-size: 26px; line-height: 1.2;
    color: var(--c-ink-2);
    letter-spacing: -.005em;
    margin: 0;
  }
  .banner__tagline em{
    font-style: normal;
    color: var(--c-ink-1);
    font-weight: 600;
  }

  /* NodeSphere brand mark on the right — same canonical viz as the
     PFP. Sized DOWN to 320 (was 380) and pulled in to right=70 so
     there's a clean ~130px gap between the wordmark's right edge
     and the sphere's left edge. Rendered with atmos:false in the
     JS below so the sphere has a contained silhouette — no halo
     bleed into the wordmark area. */
  .banner__sphere{
    position: absolute; right: 70px; top: 50%;
    transform: translateY(-50%);
    width: 320px; height: 320px;
    display: block;
  }

  /* Every τ across the banner uses the SAME glyph as the canonical
     "Subneτ Magazine" wordmark — plain Archivo (the magazine's
     display family), the exact treatment Rondo approved. Auto-wrapped
     by the JS at the bottom of this file so every τ in markup AND
     generated content carries the same brand mark. */
  .tau-brand{
    font-family: 'Archivo', 'Inter', system-ui, sans-serif;
    font-style: normal;
    font-weight: inherit;
    font-size: 1em;
    color: inherit;
    display: inline;
    line-height: 1;
  }
</style>
</head>
<body>
  <div class="banner__atmos"></div>

  <div class="banner__hero">
    <h1 class="banner__wordmark">Subneτ Magazine</h1>
    <!-- Tagline upgraded from "Biττensor research." → "The Biττensor
         research terminal." — declarative claim of category, says
         exactly what the product is (per the project's stated
         mission of being the Bloomberg terminal for Bittensor).
         "Research" alone is descriptive; "research terminal"
         is positioning. -->
    <p class="banner__tagline">The <em>Biττensor</em> research terminal.</p>
  </div>

  <canvas id="sphere" class="banner__sphere" width="320" height="320"></canvas>

  <script type="module">
    import { NodeSphere } from '/src/charts/NodeSphere.js';

    /* Same canonical NodeSphere as the PFP + masthead, sized to fit
       the right column without bleeding into the wordmark.
         - atmos: false   — the soft red halo is what was bleeding
                           leftward into "Magazine"; contained silhouette
                           per Rondo's "neural network should not be
                           merging into the words"
         - 320x320        — tighter footprint than the prior 380
         - t = 2.4        — same rotation as the PFP so the two
                           visually rhyme across the profile chrome */
    const c = document.getElementById('sphere');
    const sphere = new NodeSphere(c, {
      nodes:   180,
      K:       6,
      density: 0.20,
      edgeCap: 7000,
      speed:   0,
      glow:    true,
      atmos:   false,
    });
    sphere.draw(c.getContext('2d'), 320, 320, 2.4);

    /* Promote every τ to the .tau-brand span so the Archivo glyph
       (already the parent font here) is explicit and any future
       per-character treatment is a one-line CSS change rather than
       a markup hunt. */
    (function wrapTaus(root){
      const SKIP = new Set(['SCRIPT','STYLE','CANVAS','SVG']);
      const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
        acceptNode(node){
          if (SKIP.has(node.parentNode?.tagName)) return NodeFilter.FILTER_REJECT;
          let p = node.parentNode;
          while (p){
            if (p.classList && p.classList.contains('tau-brand')) return NodeFilter.FILTER_REJECT;
            p = p.parentNode;
          }
          return node.nodeValue.includes('τ') ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
        }
      });
      const targets = [];
      let n;
      while ((n = walker.nextNode())) targets.push(n);
      targets.forEach(textNode => {
        const frag = document.createDocumentFragment();
        textNode.nodeValue.split(/(τ)/).forEach(part => {
          if (part === 'τ'){
            const s = document.createElement('span');
            s.className = 'tau-brand';
            s.textContent = 'τ';
            frag.appendChild(s);
          } else if (part){
            frag.appendChild(document.createTextNode(part));
          }
        });
        textNode.parentNode.replaceChild(frag, textNode);
      });
    })(document.body);

    window.__BANNER_READY__ = true;
  </script>
</body>
</html>
