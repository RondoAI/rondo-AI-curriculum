<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Virtual Aquarium · Subneτ Magazine</title>
  <meta name="description" content="A 3D neural network playground. Each neuron is a dot, each connection a weighted strand. Click to kill, watch the kill-streak rise. After the open source Virtual Aquarium concept, in Subnet Magazine red.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300..800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style/tokens.css">
  <link rel="stylesheet" href="style/base.css">

  <style>
    /* =================================================================
       VIRTUAL AQUARIUM
       -----------------------------------------------------------------
       Self-contained 3D neural network playground. Layered MLP rendered
       with hand-rolled perspective projection on a 2D canvas (matches
       NodeSphere.js pattern, no Three.js dependency). Drag to orbit.
       Wheel to zoom. Click a neuron to kill it; track kill-streak.
       ================================================================= */

    html, body{
      margin: 0;
      padding: 0;
      background: #000;
      color: var(--c-ink-1, #F5E5E8);
      font-family: var(--f-mono, 'JetBrains Mono', monospace);
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    /* ====== Top status strip (matches the magazine's status-strip register) */
    .aq-top{
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px clamp(12px, 3vw, 24px);
      background: linear-gradient(180deg, rgba(255,30,60,.08) 0%, rgba(0,0,0,.78) 100%);
      border-bottom: 1px solid rgba(255,30,60,.18);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      font-size: 11px;
      letter-spacing: .08em;
    }
    .aq-top__left{
      display: flex; align-items: center; gap: 14px;
    }
    .aq-top__brand{
      color: var(--c-red-1, #FF4D60);
      font-weight: 700;
      letter-spacing: .14em;
      font-size: 12px;
    }
    .aq-top__brand::before{
      content: "⊕ ";
      color: var(--c-red, #FF1E3C);
    }
    .aq-top__title{
      color: var(--c-ink-1, #F5E5E8);
      font-weight: 600;
      letter-spacing: .12em;
    }
    .aq-top__center{
      display: flex; align-items: center; gap: 10px;
    }
    .aq-top__score{
      display: inline-flex;
      align-items: baseline;
      gap: 6px;
      padding: 6px 14px;
      border: 1px solid rgba(255,30,60,.35);
      background: rgba(255,30,60,.05);
      border-radius: 2px;
      font-variant-numeric: tabular-nums;
    }
    .aq-top__score-num{
      color: #fff;
      font-weight: 700;
      font-size: 18px;
      letter-spacing: 0;
    }
    .aq-top__score-of{
      color: var(--c-ink-3, #8B6B70);
      font-size: 13px;
    }
    .aq-top__right{
      display: flex; align-items: center; gap: 14px;
      color: var(--c-ink-2, #C8A8AD);
    }
    .aq-top__right .accent{ color: var(--c-red-1, #FF4D60); font-weight: 600; }
    .aq-top__streak{
      font-variant-numeric: tabular-nums;
      color: #fff;
      font-weight: 700;
    }

    /* ====== Layer info panels (left and right of the main canvas)
       LEFT is the editable architecture editor.
       RIGHT is hidden in v2 (the layer info is now in the editable cards). */
    .aq-side{
      position: fixed;
      z-index: 20;
      top: 70px;
      bottom: 70px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px;
      pointer-events: none;
      max-width: 220px;
    }
    .aq-side--left{ left: 10px; overflow-y: auto; pointer-events: auto; }
    .aq-side--right{ display: none; }
    .aq-side__head{
      pointer-events: auto;
      color: var(--c-red-1, #FF4D60);
      font-weight: 700;
      font-size: 10.5px;
      letter-spacing: .12em;
      padding: 4px 2px 8px;
      border-bottom: 1px solid rgba(255,30,60,.18);
      margin-bottom: 4px;
    }
    .aq-card{
      pointer-events: auto;
      min-width: 180px;
      padding: 8px 10px;
      background: rgba(0,0,0,.72);
      border: 1px solid rgba(255,30,60,.22);
      border-radius: 2px;
      font-size: 10.5px;
      line-height: 1.45;
      color: var(--c-ink-2, #C8A8AD);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }
    .aq-card__head{
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }
    .aq-card__name{
      color: var(--c-red-1, #FF4D60);
      font-weight: 700;
      letter-spacing: .12em;
      font-size: 11.5px;
    }
    .aq-card__remove{
      cursor: pointer;
      border: none;
      background: transparent;
      color: var(--c-ink-3, #8B6B70);
      font-family: inherit;
      font-size: 12px;
      padding: 0 4px;
      transition: color .15s;
    }
    .aq-card__remove:hover{ color: var(--c-red, #FF1E3C); }
    .aq-card__row{
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: var(--c-ink-2, #C8A8AD);
      margin: 4px 0;
    }
    .aq-card__row .lbl{ color: var(--c-ink-3, #8B6B70); font-size: 9.5px; letter-spacing: .08em; }
    .aq-card__row .v{ color: #fff; font-weight: 600; font-variant-numeric: tabular-nums; }
    .aq-card__slider{
      width: 100%;
      appearance: none;
      -webkit-appearance: none;
      height: 4px;
      background: rgba(255,30,60,.18);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }
    .aq-card__slider::-webkit-slider-thumb{
      -webkit-appearance: none;
      appearance: none;
      width: 12px; height: 12px;
      border-radius: 50%;
      background: var(--c-red, #FF1E3C);
      cursor: grab;
      box-shadow: 0 0 0 1px rgba(0,0,0,.6), 0 0 6px rgba(255,30,60,.55);
    }
    .aq-card__slider::-moz-range-thumb{
      width: 12px; height: 12px;
      border-radius: 50%;
      background: var(--c-red, #FF1E3C);
      cursor: grab;
      border: none;
      box-shadow: 0 0 0 1px rgba(0,0,0,.6), 0 0 6px rgba(255,30,60,.55);
    }
    .aq-card__act{
      width: 100%;
      padding: 3px 6px;
      background: rgba(0,0,0,.6);
      color: #fff;
      border: 1px solid rgba(255,30,60,.25);
      border-radius: 2px;
      font-family: inherit;
      font-size: 10.5px;
      cursor: pointer;
    }
    .aq-card.is-dead .aq-card__name{ color: var(--c-ink-3, #8B6B70); }

    .aq-add{
      pointer-events: auto;
      cursor: pointer;
      padding: 8px 10px;
      background: transparent;
      border: 1px dashed rgba(255,30,60,.45);
      color: var(--c-red-1, #FF4D60);
      font-family: inherit;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: .12em;
      border-radius: 2px;
      transition: background .15s, border-color .15s;
    }
    .aq-add:hover{
      background: rgba(255,30,60,.08);
      border-color: var(--c-red, #FF1E3C);
      border-style: solid;
    }
    .aq-add:disabled{
      opacity: .3;
      cursor: not-allowed;
    }

    .aq-presets{
      pointer-events: auto;
      display: flex;
      gap: 6px;
      margin-top: 6px;
      flex-wrap: wrap;
    }
    .aq-preset{
      cursor: pointer;
      padding: 5px 9px;
      background: rgba(255,30,60,.05);
      border: 1px solid rgba(255,30,60,.22);
      color: var(--c-ink-2, #C8A8AD);
      font-family: inherit;
      font-size: 9.5px;
      letter-spacing: .1em;
      font-weight: 700;
      border-radius: 2px;
      transition: background .15s, color .15s;
    }
    .aq-preset:hover{
      background: rgba(255,30,60,.18);
      color: #fff;
    }

    /* ====== Main canvas */
    .aq-canvas{
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
      touch-action: none;
    }
    .aq-canvas.is-grabbing{ cursor: grabbing; }
    .aq-canvas.is-killing{ cursor: crosshair; }

    /* ====== Bottom HUD */
    .aq-bottom{
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px clamp(12px, 3vw, 24px);
      background: linear-gradient(0deg, rgba(255,30,60,.08) 0%, rgba(0,0,0,.78) 100%);
      border-top: 1px solid rgba(255,30,60,.18);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      font-size: 11px;
      letter-spacing: .08em;
      color: var(--c-ink-2, #C8A8AD);
    }
    .aq-bottom__group{
      display: flex; align-items: center; gap: 14px;
      flex-wrap: wrap;
    }
    .aq-bottom__lbl{ color: var(--c-ink-3, #8B6B70); }
    .aq-bottom__val{
      color: #fff;
      font-weight: 600;
    }
    /* ====== Jellyfish button system ============================
       Soft pill shapes with breathing glows, spring-loaded press,
       bouncy hovers, ripple on click. Magazine red, but alive. */

    @keyframes aq-breathe {
      0%, 100% { box-shadow: 0 0 14px rgba(255,30,60,.35), inset 0 0 8px rgba(255,30,60,.25); }
      50%      { box-shadow: 0 0 22px rgba(255,30,60,.55), inset 0 0 14px rgba(255,30,60,.45); }
    }
    @keyframes aq-bloom {
      0%   { transform: scale(.92); opacity: 0; }
      60%  { transform: scale(1.08); opacity: .8; }
      100% { transform: scale(1.0);  opacity: 0; }
    }
    @keyframes aq-pulse-once {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.12); }
      100% { transform: scale(1); }
    }
    @keyframes aq-shimmer {
      0%   { background-position: -100% 0; }
      100% { background-position: 200% 0; }
    }

    /* The KILL toggle is the most prominent button — give it the
       full jellyfish treatment when ON. */
    .aq-toggle{
      position: relative;
      overflow: hidden;
      cursor: pointer;
      padding: 8px 18px;
      border: 1px solid rgba(255,30,60,.45);
      border-radius: 24px;
      background:
        radial-gradient(ellipse at center, rgba(255,30,60,.08) 0%, rgba(0,0,0,.6) 70%);
      color: var(--c-red-1, #FF4D60);
      font-family: inherit;
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: .16em;
      transition:
        background .4s cubic-bezier(.34, 1.56, .64, 1),
        color .25s ease,
        border-color .25s ease,
        transform .25s cubic-bezier(.34, 1.56, .64, 1);
      will-change: transform, box-shadow;
    }
    .aq-toggle:hover{
      background:
        radial-gradient(ellipse at center, rgba(255,30,60,.18) 0%, rgba(0,0,0,.5) 80%);
      transform: scale(1.05);
    }
    .aq-toggle:active{
      transform: scale(.96);
    }
    .aq-toggle.is-on{
      background:
        radial-gradient(ellipse at center, #FF1E3C 0%, #C11128 70%, #8B0F20 100%);
      color: #fff;
      border-color: #FF4D60;
      animation: aq-breathe 2.4s ease-in-out infinite;
      text-shadow: 0 0 6px rgba(255,255,255,.4);
    }
    .aq-toggle.is-on:hover{
      background:
        radial-gradient(ellipse at center, #FF4D60 0%, #FF1E3C 70%, #C11128 100%);
      transform: scale(1.06);
    }
    /* Inner glow bubble that swells on press */
    .aq-toggle::after{
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(circle at var(--px, 50%) var(--py, 50%), rgba(255,255,255,.5) 0%, transparent 60%);
      opacity: 0;
      pointer-events: none;
    }
    .aq-toggle.is-pressed::after{
      animation: aq-bloom .55s cubic-bezier(.34, 1.56, .64, 1);
    }

    /* The RESET / secondary buttons — calmer than KILL but still alive. */
    .aq-btn{
      position: relative;
      overflow: hidden;
      cursor: pointer;
      padding: 8px 18px;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 24px;
      background: linear-gradient(180deg, rgba(255,255,255,.04) 0%, rgba(0,0,0,.4) 100%);
      color: var(--c-ink-2, #C8A8AD);
      font-family: inherit;
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: .14em;
      transition:
        border-color .25s ease,
        color .25s ease,
        transform .25s cubic-bezier(.34, 1.56, .64, 1),
        background .3s ease;
    }
    .aq-btn:hover{
      border-color: rgba(255,30,60,.6);
      color: #fff;
      background: linear-gradient(180deg, rgba(255,30,60,.08) 0%, rgba(0,0,0,.4) 100%);
      transform: scale(1.05);
      box-shadow: 0 0 12px rgba(255,30,60,.28);
    }
    .aq-btn:active{ transform: scale(.96); }
    .aq-btn::after{
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(circle at var(--px, 50%) var(--py, 50%), rgba(255,77,96,.6) 0%, transparent 50%);
      opacity: 0;
      pointer-events: none;
    }
    .aq-btn.is-pressed::after{
      animation: aq-bloom .5s cubic-bezier(.34, 1.56, .64, 1);
    }

    /* Preset chips — softer, smaller, bouncy hover. */
    .aq-preset{
      position: relative;
      overflow: hidden;
      cursor: pointer;
      padding: 7px 11px;
      background: linear-gradient(180deg, rgba(255,30,60,.06) 0%, rgba(255,30,60,.02) 100%);
      border: 1px solid rgba(255,30,60,.24);
      border-radius: 18px;
      color: var(--c-ink-2, #C8A8AD);
      font-family: inherit;
      font-size: 9.5px;
      letter-spacing: .12em;
      font-weight: 700;
      transition:
        background .25s ease,
        color .25s ease,
        border-color .25s ease,
        transform .25s cubic-bezier(.34, 1.56, .64, 1);
    }
    .aq-preset:hover{
      background: linear-gradient(180deg, rgba(255,30,60,.22) 0%, rgba(255,30,60,.08) 100%);
      color: #fff;
      border-color: var(--c-red, #FF1E3C);
      transform: scale(1.08) translateY(-1px);
      box-shadow: 0 4px 12px rgba(255,30,60,.32);
    }
    .aq-preset:active{ transform: scale(.96); }

    /* + ADD HIDDEN LAYER — dashed by default, fills in on hover with a soft breathing pulse. */
    .aq-add{
      position: relative;
      overflow: hidden;
      pointer-events: auto;
      cursor: pointer;
      padding: 10px 12px;
      background: transparent;
      border: 1px dashed rgba(255,30,60,.45);
      color: var(--c-red-1, #FF4D60);
      font-family: inherit;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: .14em;
      border-radius: 6px;
      transition:
        background .3s ease,
        border-color .25s ease,
        color .2s ease,
        transform .25s cubic-bezier(.34, 1.56, .64, 1);
    }
    .aq-add:hover{
      background: linear-gradient(135deg, rgba(255,30,60,.18) 0%, rgba(255,30,60,.06) 100%);
      border-color: var(--c-red, #FF1E3C);
      border-style: solid;
      color: #fff;
      transform: scale(1.02);
      box-shadow: 0 0 16px rgba(255,30,60,.35), inset 0 0 12px rgba(255,30,60,.18);
    }
    .aq-add:active{ transform: scale(.98); }
    .aq-add:disabled{
      opacity: .3;
      cursor: not-allowed;
      pointer-events: none;
    }

    /* Remove (×) button on layer cards — small, but with a bounce too. */
    .aq-card__remove{
      cursor: pointer;
      border: 1px solid transparent;
      background: transparent;
      color: var(--c-ink-3, #8B6B70);
      font-family: inherit;
      font-size: 14px;
      line-height: 1;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition:
        background .2s ease,
        color .2s ease,
        border-color .2s ease,
        transform .2s cubic-bezier(.34, 1.56, .64, 1);
    }
    .aq-card__remove:hover{
      background: rgba(255,30,60,.18);
      color: var(--c-red, #FF1E3C);
      border-color: rgba(255,30,60,.6);
      transform: scale(1.15) rotate(90deg);
      box-shadow: 0 0 10px rgba(255,30,60,.45);
    }
    .aq-card__remove:active{ transform: scale(.85) rotate(90deg); }

    /* Activation dropdown — give it a soft red focus state. */
    .aq-card__act{
      width: 100%;
      padding: 5px 8px;
      background: rgba(0,0,0,.6);
      color: #fff;
      border: 1px solid rgba(255,30,60,.25);
      border-radius: 4px;
      font-family: inherit;
      font-size: 10.5px;
      cursor: pointer;
      transition: border-color .2s ease, background .2s ease, box-shadow .2s ease;
    }
    .aq-card__act:hover, .aq-card__act:focus{
      border-color: var(--c-red-1, #FF4D60);
      background: rgba(0,0,0,.75);
      box-shadow: 0 0 8px rgba(255,30,60,.32);
      outline: none;
    }

    /* Slider thumb — more pronounced glow + bouncier press. */
    .aq-card__slider{
      width: 100%;
      appearance: none;
      -webkit-appearance: none;
      height: 5px;
      background: linear-gradient(90deg, rgba(255,30,60,.4) 0%, rgba(255,30,60,.12) 100%);
      border-radius: 3px;
      outline: none;
      cursor: pointer;
    }
    .aq-card__slider::-webkit-slider-thumb{
      -webkit-appearance: none;
      appearance: none;
      width: 16px; height: 16px;
      border-radius: 50%;
      background: radial-gradient(circle, #FF4D60 0%, #FF1E3C 60%, #C11128 100%);
      cursor: grab;
      border: 1px solid rgba(255,255,255,.25);
      box-shadow: 0 0 0 2px rgba(0,0,0,.6), 0 0 12px rgba(255,30,60,.7);
      transition: transform .15s cubic-bezier(.34, 1.56, .64, 1);
    }
    .aq-card__slider::-webkit-slider-thumb:hover{ transform: scale(1.2); }
    .aq-card__slider::-webkit-slider-thumb:active{ cursor: grabbing; transform: scale(1.1); }
    .aq-card__slider::-moz-range-thumb{
      width: 16px; height: 16px;
      border-radius: 50%;
      background: radial-gradient(circle, #FF4D60 0%, #FF1E3C 60%, #C11128 100%);
      cursor: grab;
      border: 1px solid rgba(255,255,255,.25);
      box-shadow: 0 0 0 2px rgba(0,0,0,.6), 0 0 12px rgba(255,30,60,.7);
    }

    /* Nav chips — soft red glow on the active tab, hover swell on others */
    .aq-nav__tab{
      transition: color .25s ease, background .25s ease, transform .25s cubic-bezier(.34, 1.56, .64, 1);
    }
    .aq-nav__tab:hover{
      transform: scale(1.06);
    }
    .aq-nav__tab.is-active{
      animation: aq-breathe 3s ease-in-out infinite;
    }
    .aq-bottom__hint{
      color: var(--c-ink-3, #8B6B70);
      font-size: 10px;
    }

    /* ====== Top nav strip — mirrors the magazine masthead chips
       so the reader can navigate back to the rest of the site without
       loading the full Masthead.js machinery. */
    .aq-nav{
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 40;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 6px clamp(10px, 3vw, 20px);
      background: #000;
      border-bottom: 1px solid rgba(255,30,60,.18);
      font-size: 10px;
      letter-spacing: .14em;
    }
    .aq-nav__tab{
      display: inline-flex;
      align-items: baseline;
      gap: 6px;
      padding: 5px 10px;
      color: var(--c-ink-3, #8B6B70);
      text-decoration: none;
      font-family: var(--f-mono, monospace);
      transition: color .15s, background .15s;
      border-radius: 2px;
    }
    .aq-nav__tab:hover{
      color: var(--c-red-1, #FF4D60);
      background: rgba(255,30,60,.05);
    }
    .aq-nav__tab.is-active{
      color: var(--c-red, #FF1E3C);
      background: rgba(255,30,60,.08);
    }
    .aq-nav__code{
      color: var(--c-ink-4, #4A2A30);
      font-size: 9px;
      font-weight: 700;
    }
    .aq-nav__tab.is-active .aq-nav__code,
    .aq-nav__tab:hover .aq-nav__code{
      color: var(--c-red, #FF1E3C);
    }
    .aq-nav__label{
      font-weight: 700;
    }

    /* The top status strip needs to shift down to make room for the nav */
    .aq-top{ top: 30px !important; }
    .aq-side{ top: 100px !important; }

    /* ====== Mobile drawer for the architecture editor =================
       On phones the side panel slides up from the bottom as a sheet
       triggered by the ≡ EDIT NETWORK tab. Tap the handle to expand,
       tap the X (or the canvas) to collapse. */
    /* aq-hint-mobile — top-of-canvas hint band shown on mobile only.
       Hidden by default on desktop; the @media block above turns it on. */
    .aq-hint-mobile{ display: none; }

    /* BUILD button — mobile only, sits inside the bottom HUD.
       Same jellyfish toggle base, but shown only on mobile and with a
       continuous breathing animation to draw attention since the
       architecture editor isn't otherwise visible there. */
    .aq-build{
      display: none !important;
    }
    @media (max-width: 720px){
      .aq-build{
        display: inline-flex !important;
        align-items: center;
        animation: aq-breathe 2.4s ease-in-out infinite;
        background: radial-gradient(ellipse at center, #FF1E3C 0%, #C11128 70%, #8B0F20 100%);
        color: #fff;
        border-color: #FF4D60;
      }
    }

    .aq-drawer-close{
      display: none;
      position: fixed;
      top: env(safe-area-inset-top, 0);
      right: 0;
      z-index: 60;
      width: 44px; height: 44px;
      background: rgba(0,0,0,.7);
      border: 1px solid rgba(255,30,60,.45);
      border-radius: 50%;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      margin: 12px;
      align-items: center;
      justify-content: center;
    }

    /* ====== Mobile compaction */
    @media (max-width: 720px){
      .aq-top, .aq-bottom{
        font-size: 10px;
        padding: 8px 10px;
        padding-bottom: calc(8px + env(safe-area-inset-bottom, 0));
      }
      .aq-top{
        padding-top: calc(8px + env(safe-area-inset-top, 0));
      }
      .aq-top__brand{ font-size: 11px; }
      .aq-top__title{ font-size: 11px; }
      .aq-top__score-num{ font-size: 15px; }
      .aq-nav{
        font-size: 9px;
        padding: 5px 8px;
        gap: 0;
        padding-top: calc(5px + env(safe-area-inset-top, 0));
      }
      .aq-nav__tab{ padding: 3px 7px; gap: 4px; }
      .aq-nav__code{ display: none; }

      /* On mobile, hide BOTH the camera/theme group and the hint group
         so the bottom HUD becomes a clean 3-button row: BUILD KILL RESET.
         Hint is moved to the top of the canvas as a brief one-line band
         (see .aq-hint-mobile below). */
      .aq-bottom__group:nth-child(1){ display: none; }       /* camera/theme */
      .aq-bottom__group:nth-child(2){ display: none; }       /* hint */

      /* Make the bottom HUD center its remaining group and let buttons
         space themselves evenly. */
      .aq-bottom{
        justify-content: center;
      }
      .aq-bottom__group:nth-child(3){
        display: flex;
        gap: 10px;
        flex-wrap: nowrap;
        justify-content: center;
      }
      .aq-bottom__group:nth-child(3) .aq-toggle,
      .aq-bottom__group:nth-child(3) .aq-btn{
        padding: 8px 12px;
        font-size: 10.5px;
      }
      /* Top-of-canvas hint band — only on mobile, so the reader knows
         what to do without the bottom HUD cluttering up. */
      .aq-hint-mobile{
        display: block;
        position: fixed;
        top: calc(78px + env(safe-area-inset-top, 0));
        left: 0; right: 0;
        z-index: 25;
        text-align: center;
        font-size: 10.5px;
        letter-spacing: .06em;
        color: var(--c-ink-2, #C8A8AD);
        background: rgba(0,0,0,.55);
        padding: 8px 12px;
        pointer-events: none;
        border-bottom: 1px solid rgba(255,30,60,.18);
      }
      .aq-hint-mobile strong{ color: var(--c-red-1, #FF4D60); font-weight: 700; }

      /* Bottom-drawer pattern: the side panel becomes a slide-up sheet */
      .aq-side--left{
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        top: auto !important;
        max-width: 100%;
        height: 72vh;
        max-height: 72vh;
        padding: 18px 14px 80px;
        background: rgba(0,0,0,.96);
        border-top: 1px solid rgba(255,30,60,.45);
        border-radius: 18px 18px 0 0;
        box-shadow: 0 -12px 40px rgba(255,30,60,.25);
        transform: translateY(100%);
        transition: transform .35s cubic-bezier(.34, 1.56, .64, 1);
        z-index: 50;
      }
      .aq-side--left.is-open{
        transform: translateY(0);
      }
      .aq-side--left.is-open + .aq-drawer-close{ display: flex; }

      /* Handle tab visible on mobile */
      .aq-handle{ display: inline-block; }

      /* Hide the handle while the drawer is open */
      .aq-side--left.is-open ~ .aq-handle{ display: none; }
    }

    /* Smaller phones */
    @media (max-width: 380px){
      .aq-nav__tab{ padding: 3px 5px; }
      .aq-top__brand{ display: none; }
    }
  </style>
</head>
<body>

  <!-- Top nav strip (matches magazine masthead chips, this page is AQUARIUM 061) -->
  <nav class="aq-nav" aria-label="Magazine navigation">
    <a class="aq-nav__tab" href="index.html"><span class="aq-nav__code">001</span><span class="aq-nav__label">MAGAZINE</span></a>
    <a class="aq-nav__tab" href="oracle.html"><span class="aq-nav__code">010</span><span class="aq-nav__label">ORACLE</span></a>
    <a class="aq-nav__tab" href="cockpit.html"><span class="aq-nav__code">037</span><span class="aq-nav__label">COCKPIT</span></a>
    <a class="aq-nav__tab is-active" href="aquarium.html"><span class="aq-nav__code">061</span><span class="aq-nav__label">AQUARIUM</span></a>
  </nav>

  <!-- Top status strip: brand, title, score, kill-streak -->
  <div class="aq-top">
    <div class="aq-top__left">
      <span class="aq-top__brand">SUBNEτ MAGAZINE</span>
      <span class="aq-top__title">VIRTUAL AQUARIUM</span>
    </div>
    <div class="aq-top__center">
      <span class="aq-top__score">
        <span class="aq-top__score-num" data-score-alive>0</span>
        <span class="aq-top__score-of">/</span>
        <span class="aq-top__score-num" data-score-total>0</span>
      </span>
    </div>
    <div class="aq-top__right">
      <span><span class="aq-top__lbl">kill-streak:</span> <span class="aq-top__streak" data-streak>0</span></span>
      <span><span class="aq-top__lbl">best:</span> <span class="aq-top__streak" data-best>0</span></span>
    </div>
  </div>

  <!-- Mobile-only hint band: explains what the reader can do -->
  <div class="aq-hint-mobile">
    <strong>drag</strong> to orbit · <strong>pinch</strong> to zoom · <strong>tap</strong> a neuron to kill
  </div>

  <!-- Editable architecture panel (left side on desktop, bottom drawer on mobile) -->
  <aside class="aq-side aq-side--left" data-side-left></aside>
  <button class="aq-drawer-close" data-drawer-close aria-label="Close editor">×</button>


  <!-- Main 3D canvas -->
  <canvas class="aq-canvas" data-canvas></canvas>

  <!-- Bottom HUD: camera mode, theme, kill toggle, reset, hint -->
  <div class="aq-bottom">
    <div class="aq-bottom__group">
      <span><span class="aq-bottom__lbl">camera:</span> <span class="aq-bottom__val">Free (3D)</span></span>
      <span><span class="aq-bottom__lbl">theme:</span> <span class="aq-bottom__val" data-theme>RedTide</span></span>
    </div>
    <div class="aq-bottom__group">
      <span class="aq-bottom__hint">drag to orbit · wheel to zoom · click a neuron to kill</span>
    </div>
    <div class="aq-bottom__group">
      <button class="aq-toggle aq-build" data-drawer-open data-mobile-only>≡ BUILD</button>
      <button class="aq-toggle is-on" data-kill-toggle>KILL: ON</button>
      <button class="aq-btn" data-reset>RESET</button>
    </div>
  </div>

  <script type="module">
    /* =================================================================
       NEURAL AQUARIUM, PAGE GLUE
       -----------------------------------------------------------------
       The simulation lives in src/charts/NeuralAquarium.js. This script
       does three things:

         1. Boot — read the URL for a saved architecture, fall back to
            defaults, instantiate the chart, wire its lifecycle.
         2. UI wiring — build the editable layer cards in the side
            panel (and bottom drawer on mobile), wire sliders /
            dropdowns / + button / × buttons / preset chips.
         3. HUD updates — listen to the chart's onChange / onKill
            hooks and update score / streak / best in the top bar,
            push the architecture to the URL.

       No simulation state lives here; that's the chart's job. This
       script only owns DOM.
       ================================================================= */

    import {
      NeuralAquarium,
      DEFAULT_LAYERS,
      MOBILE_DEFAULT_LAYERS,
      PRESETS,
    } from './src/charts/NeuralAquarium.js';
    import {
      readFromURL,
      writeToURL,
      describeLayers,
    } from './src/lib/aquarium-state.js';
    import { qs, on } from './src/lib/dom.js';

    /* ---------- DOM refs ------------------------------------------- */
    const canvas        = qs('[data-canvas]');
    const elScoreAlive  = qs('[data-score-alive]');
    const elScoreTotal  = qs('[data-score-total]');
    const elStreak      = qs('[data-streak]');
    const elBest        = qs('[data-best]');
    const elKillToggle  = qs('[data-kill-toggle]');
    const elReset       = qs('[data-reset]');
    const elSideLeft    = qs('[data-side-left]');

    const ACTIVATIONS = ['linear', 'ReLU', 'Sigmoid', 'Tanh', 'Softmax'];

    /* ---------- session state ------------------------------------- */
    /* Game-shaped state kept here (not in the chart) because it has
       no rendering contract — pure counters. */
    const sessionState = {
      killStreak: 0,
      bestStreak: parseInt(localStorage.getItem('aq-best') || '0', 10) || 0,
    };
    elBest.textContent = sessionState.bestStreak;

    /* ---------- boot ---------------------------------------------- */
    const isMobile = window.matchMedia && window.matchMedia('(max-width: 720px)').matches;
    const initialLayers = readFromURL()
      || (isMobile ? [...MOBILE_DEFAULT_LAYERS] : [...DEFAULT_LAYERS]);

    const aq = new NeuralAquarium(canvas, {
      initialLayers,
      onChange: (model) => {
        renderEditor(model);
        updateScore(model);
        writeToURL(model.layers, /* killCount */ 0);
      },
      onKill: (model, miss) => {
        if (miss){
          if (sessionState.killStreak > 0){
            sessionState.killStreak = 0;
            elStreak.textContent = '0';
          }
          return;
        }
        sessionState.killStreak += 1;
        if (sessionState.killStreak > sessionState.bestStreak){
          sessionState.bestStreak = sessionState.killStreak;
          localStorage.setItem('aq-best', String(sessionState.bestStreak));
          elBest.textContent = sessionState.bestStreak;
        }
        elStreak.textContent = sessionState.killStreak;
        renderEditor(model);
        updateScore(model);
      },
    });

    /* ---------- HUD refresh --------------------------------------- */
    function updateScore(model){
      const alive = model.aliveCount();
      const total = model.neurons.length;
      elScoreAlive.textContent = String(alive);
      elScoreTotal.textContent = String(total);
    }

    /* ---------- editor: layer cards + presets + add --------------- */
    function renderEditor(model){
      elSideLeft.innerHTML = '';

      const head = document.createElement('div');
      head.className = 'aq-side__head';
      head.textContent = '▾ YOUR NETWORK';
      elSideLeft.appendChild(head);

      model.layers.forEach((layer, li) => {
        const alive = model.groups[li]
          ? model.groups[li].neurons.filter(n => n.alive).length
          : layer.n;
        const isFixed = (li === 0) || (li === model.layers.length - 1);
        const card = document.createElement('div');
        card.className = 'aq-card' + (alive === 0 ? ' is-dead' : '');
        card.dataset.layer = li;

        const opts = ACTIVATIONS
          .map(a => `<option value="${a}"${a === layer.act ? ' selected' : ''}>${a}</option>`)
          .join('');

        card.innerHTML = `
          <div class="aq-card__head">
            <span class="aq-card__name">${layer.name}</span>
            ${isFixed ? '' : '<button class="aq-card__remove" data-remove aria-label="Remove layer">×</button>'}
          </div>
          <div class="aq-card__row">
            <span class="lbl">NEURONS</span>
            <span class="v" data-count>${alive}/${layer.n}</span>
          </div>
          <input class="aq-card__slider" type="range" min="1" max="32" value="${layer.n}" data-slider aria-label="${layer.name} neuron count">
          <div class="aq-card__row" style="margin-top:6px;">
            <span class="lbl">ACTIVATION</span>
          </div>
          <select class="aq-card__act" data-act aria-label="${layer.name} activation function">${opts}</select>
        `;
        elSideLeft.appendChild(card);

        // Slider — debounce a touch so dragging fast doesn't thrash
        // the rebuild spring with every input event
        const slider = card.querySelector('[data-slider]');
        let pendingValue = null;
        slider.addEventListener('input', (e) => {
          const v = parseInt(e.target.value, 10);
          pendingValue = v;
          card.querySelector('[data-count]').textContent = `${v}/${v}`;
        });
        slider.addEventListener('change', () => {
          if (pendingValue !== null) aq.setLayerSize(li, pendingValue);
          pendingValue = null;
        });
        // Also commit on pointerup for touch devices that don't fire
        // 'change' until much later (some Android browsers)
        slider.addEventListener('pointerup', () => {
          if (pendingValue !== null) aq.setLayerSize(li, pendingValue);
          pendingValue = null;
        });

        // Activation
        card.querySelector('[data-act]').addEventListener('change', (e) => {
          aq.setLayerActivation(li, e.target.value);
        });

        // × remove
        const rm = card.querySelector('[data-remove]');
        if (rm) rm.addEventListener('click', () => aq.removeHiddenLayer(li));
      });

      // + ADD HIDDEN LAYER
      const addBtn = document.createElement('button');
      addBtn.className = 'aq-add';
      addBtn.textContent = '+ ADD HIDDEN LAYER';
      addBtn.disabled = model.layers.length >= 9;
      addBtn.addEventListener('click', () => aq.addHiddenLayer());
      elSideLeft.appendChild(addBtn);

      // Preset chips
      const presetRow = document.createElement('div');
      presetRow.className = 'aq-presets';
      for (const [name, config] of Object.entries(PRESETS)){
        const btn = document.createElement('button');
        btn.className = 'aq-preset';
        btn.textContent = name.toUpperCase();
        btn.addEventListener('click', () => {
          aq.loadLayers(config);
          sessionState.killStreak = 0;
          elStreak.textContent = '0';
        });
        presetRow.appendChild(btn);
      }
      elSideLeft.appendChild(presetRow);
    }

    /* ---------- bottom HUD buttons -------------------------------- */
    elKillToggle.addEventListener('click', () => {
      const on = !aq.isKilling();
      aq.setKillMode(on);
      elKillToggle.classList.toggle('is-on', on);
      elKillToggle.textContent = on ? 'KILL: ON' : 'KILL: OFF';
      canvas.classList.toggle('is-killing', on);
    });

    elReset.addEventListener('click', () => {
      aq.resetNetwork();
      sessionState.killStreak = 0;
      elStreak.textContent = '0';
      renderEditor(aq.model);
      updateScore(aq.model);
    });

    /* ---------- mobile drawer ------------------------------------- */
    const sideEl = document.querySelector('.aq-side--left');
    const drawerOpen = document.querySelector('[data-drawer-open]');
    const drawerClose = document.querySelector('[data-drawer-close]');
    if (drawerOpen) drawerOpen.addEventListener('click', (ev) => {
      ev.stopPropagation();
      sideEl.classList.add('is-open');
    });
    if (drawerClose) drawerClose.addEventListener('click', () => {
      sideEl.classList.remove('is-open');
    });
    // Tap outside the drawer (on the canvas) closes it
    canvas.addEventListener('pointerdown', () => {
      if (sideEl.classList.contains('is-open')){
        sideEl.classList.remove('is-open');
      }
    }, true);

    /* ---------- jellyfish ripple effect --------------------------- */
    document.addEventListener('click', (ev) => {
      const btn = ev.target.closest('.aq-toggle, .aq-btn, .aq-preset, .aq-add');
      if (!btn) return;
      const r = btn.getBoundingClientRect();
      const px = ((ev.clientX - r.left) / r.width)  * 100;
      const py = ((ev.clientY - r.top)  / r.height) * 100;
      btn.style.setProperty('--px', `${px}%`);
      btn.style.setProperty('--py', `${py}%`);
      btn.classList.remove('is-pressed');
      void btn.offsetWidth;
      btn.classList.add('is-pressed');
      setTimeout(() => btn.classList.remove('is-pressed'), 600);
    }, true);

    /* ---------- boot the editor + score on first paint ------------ */
    renderEditor(aq.model);
    updateScore(aq.model);
    canvas.classList.toggle('is-killing', aq.isKilling());

    /* ---------- expose for debugging only (non-enumerable) -------- */
    Object.defineProperty(window, '__aq', { value: aq, configurable: true });

    /* ---------- clean up on navigation away ----------------------- */
    window.addEventListener('beforeunload', () => aq.destroy());
  </script>
</body>
</html>
