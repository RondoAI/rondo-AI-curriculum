name: Build Rondo.py APK

# Builds an Android debug APK via Buildozer on every push that touches
# the python-tutor-app/ project, plus a manual trigger from the
# "Actions" tab. The APK lands as a downloadable workflow artifact.
on:
  push:
    paths:
      - 'projects/python-tutor-app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    name: Buildozer · debug APK
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system dependencies for python-for-android
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf automake libtool libltdl-dev pkg-config \
            zlib1g-dev libncurses-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev build-essential ccache

      - name: Cache Buildozer global state
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ runner.os }}-${{ hashFiles('projects/python-tutor-app/buildozer.spec') }}
          restore-keys: |
            buildozer-global-${{ runner.os }}-

      - name: Cache Buildozer project state
        uses: actions/cache@v4
        with:
          path: projects/python-tutor-app/.buildozer
          key: buildozer-project-${{ runner.os }}-${{ hashFiles('projects/python-tutor-app/buildozer.spec') }}
          restore-keys: |
            buildozer-project-${{ runner.os }}-

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade buildozer "cython<3" virtualenv

      - name: Build debug APK
        working-directory: projects/python-tutor-app
        run: buildozer -v android debug

      - name: List build output
        if: always()
        working-directory: projects/python-tutor-app
        run: ls -la bin/ || true

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rondo-py-debug-apk
          path: projects/python-tutor-app/bin/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload Buildozer logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-logs
          path: |
            projects/python-tutor-app/.buildozer/android/platform/build-*/dists/**/*.log
            projects/python-tutor-app/.buildozer/**/last_log.txt
          retention-days: 7
          if-no-files-found: ignore
