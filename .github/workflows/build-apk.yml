name: Build Rondo.py APK

# Builds an Android debug APK via Buildozer. On failure, prints the
# tail of the build log directly to the workflow output — no need to
# dig through expanding sections. The APK lands as a downloadable
# artifact on success.
on:
  push:
    paths:
      - 'projects/python-tutor-app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    name: Buildozer · debug APK
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system dependencies
        run: |
          set -ex
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf automake libtool libtool-bin pkg-config \
            zlib1g-dev libffi-dev libssl-dev \
            build-essential ccache

      - name: Cache Buildozer global state
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ runner.os }}-${{ hashFiles('projects/python-tutor-app/buildozer.spec') }}
          restore-keys: |
            buildozer-global-${{ runner.os }}-

      - name: Cache Buildozer project state
        uses: actions/cache@v4
        with:
          path: projects/python-tutor-app/.buildozer
          key: buildozer-project-${{ runner.os }}-${{ hashFiles('projects/python-tutor-app/buildozer.spec') }}
          restore-keys: |
            buildozer-project-${{ runner.os }}-

      - name: Install Python build tools
        run: |
          set -ex
          python -m pip install --upgrade pip
          pip install --upgrade buildozer "cython<3" virtualenv

      - name: Show environment
        continue-on-error: true
        run: |
          python --version || true
          pip --version || true
          buildozer --version || true
          java -version || true
          command -v autoconf libtool pkg-config || true
          uname -a || true

      - name: Pre-accept Android SDK licenses
        run: |
          set -ex
          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK_DIR/licenses"
          # Well-known accepted-license SHA1s — these tell sdkmanager
          # "yes I accept" without an interactive prompt.
          cat > "$SDK_DIR/licenses/android-sdk-license" <<'EOF'
          8933bad161af4178b1185d1a37fbf41ea5269c55
          d56f5187479451eabf01fb78af6dfcb131a6481e
          24333f8a63b6825ea9c5514f83c2829b004d1fee
          EOF
          cat > "$SDK_DIR/licenses/android-sdk-preview-license" <<'EOF'
          84831b9409646a918e30573bab4c9c91346d8abd
          EOF
          cat > "$SDK_DIR/licenses/intel-android-extra-license" <<'EOF'
          d975f751698a77b662f1254ddbeed3901e976f5a
          EOF
          cat > "$SDK_DIR/licenses/google-gdk-license" <<'EOF'
          33b6a2b64607f11b759f320ef9dff4ae5c47d97a
          EOF
          ls -la "$SDK_DIR/licenses/"

      - name: Build debug APK
        working-directory: projects/python-tutor-app
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Show last 250 lines of build log on failure
        if: failure()
        working-directory: projects/python-tutor-app
        run: |
          echo "========== BUILDOZER LOG TAIL =========="
          tail -250 build.log || true
          echo "========== END OF LOG TAIL =========="

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: projects/python-tutor-app/build.log
          retention-days: 14
          if-no-files-found: ignore

      - name: List build output
        if: always()
        working-directory: projects/python-tutor-app
        run: ls -la bin/ || true

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rondo-py-debug-apk
          path: projects/python-tutor-app/bin/*.apk
          retention-days: 30
          if-no-files-found: error
