name: Build Rondo.py APK

# Builds an Android debug APK via the buildozer-action, which runs
# Buildozer inside a known-good Docker image (no host-level apt
# guesswork). APK lands as a downloadable workflow artifact.
on:
  push:
    paths:
      - 'projects/python-tutor-app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    name: Buildozer · debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Buildozer state
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            projects/python-tutor-app/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('projects/python-tutor-app/buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Build APK with Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          workdir: projects/python-tutor-app
          buildozer_version: stable
          command: buildozer android debug

      - name: List build output
        if: always()
        working-directory: projects/python-tutor-app
        run: ls -la bin/ || true

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rondo-py-debug-apk
          path: ${{ steps.buildozer.outputs.filename }}
          retention-days: 30
          if-no-files-found: error
