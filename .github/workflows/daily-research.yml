# =================================================================
# SUBNET ORACLE RESEARCH, DAILY AGENT
# -----------------------------------------------------------------
# What this workflow does, every day at 08:00 UTC:
#
#   1. Spins up an Ubuntu runner with Python 3.12 + reportlab + the
#      Anthropic SDK
#   2. Runs scripts/daily-research.py, which:
#        a. reads src/data/articles.js to learn which subnets the
#           HUMAN editorial desk has covered (those are off-limits)
#        b. reads src/data/oracle-articles.js to learn which subnets
#           the AI Oracle itself has covered in the last 30 days
#           (rotate away from them)
#        c. fetches a live market snapshot from TAO Market Cap
#        d. calls Claude Opus 4.7 in a two-pass pipeline:
#             PASS 1 with web_search server tool: agent reads
#                    8 to 15 sources and drafts both articles
#             PASS 2 with structured output: convert draft to
#                    the strict JSON schema
#        e. scrubs every em-dash and en-dash from the result
#        f. renders each article to a dark-mode PDF in
#           projects/subnet-magazine-v2/oracle-articles/
#        g. prepends both articles + their pdf paths to
#           src/data/oracle-articles.js
#   3. Commits both the data file AND the new PDFs in one commit
#   4. Pushes to subnet-mag-v2
#
# Editorial standard the agent is held to (hard-coded in
# scripts/daily-research.py SYSTEM_PROMPT):
#   - PhD-level mechanism-aware analysis
#   - Hedge uncertainty explicitly
#   - Never use em-dashes (belt + suspenders: prompt forbids,
#     Python regex strips any that slip through)
#   - Compete with the human magazine on depth, sourcing, mechanism
#   - File work the magazine team can learn from
#
# Required repository secret:
#   ANTHROPIC_API_KEY    Settings, Secrets and variables, Actions,
#                        New repository secret
#
# Manual trigger:
#   Actions tab, "Subnet Oracle Research, daily", Run workflow
# =================================================================

name: Subnet Oracle Research, daily

on:
  schedule:
    # 08:00 UTC every day. Cron is UTC-only on GitHub Actions.
    - cron: '0 8 * * *'
  workflow_dispatch:
    # Manual trigger from the Actions tab or the GitHub API.
    inputs:
      extra_instruction:
        description: >
          One-off editorial steer passed to the Oracle for this run
          only. Use to constrain or redirect topic choice when the
          human desk is publishing same-day, or to dictate a specific
          angle. Empty in normal cron operation.
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  # If a manual run starts while the cron is mid-flight, queue rather
  # than parallelise. The data file mutates and parallel writes would
  # race + corrupt the JS literal.
  group: subnet-oracle-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    # web_search + thinking + two-pass pipeline takes longer than a
    # single API call; budget accordingly.
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: subnet-mag-v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'anthropic>=0.92.0' 'reportlab>=4.0'

      - name: File today's Oracle research
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ORACLE_EXTRA_INSTRUCTION: ${{ inputs.extra_instruction }}
        working-directory: projects/subnet-magazine-v2
        run: python scripts/daily-research.py

      - name: Commit and push
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name  "subnet-oracle-bot"
          git config user.email "oracle@subnetmagazine.com"

          # The data file gets mutated; PDFs land in
          # projects/subnet-magazine-v2/oracle-articles/. If neither
          # changed (script skipped because today's articles already
          # exist) exit cleanly.
          if git diff --quiet -- projects/subnet-magazine-v2/src/data/oracle-articles.js \
                                  projects/subnet-magazine-v2/oracle-articles/; then
            echo "no changes to oracle-articles.js or PDFs, exiting"
            exit 0
          fi

          today=$(date -u +%Y-%m-%d)
          git add projects/subnet-magazine-v2/src/data/oracle-articles.js
          git add projects/subnet-magazine-v2/oracle-articles/
          git commit -m "oracle: daily research, ${today}

Auto-generated by .github/workflows/daily-research.yml via
scripts/daily-research.py. Two articles filed: a subnet
spotlight and an ecosystem state read, plus their dark-mode
PDFs. The agent reads 8 to 15 sources via web_search before
writing. See src/data/oracle-articles.js for the data and
oracle-articles/ for the PDFs."
          git push origin subnet-mag-v2
